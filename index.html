<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Blog</title>
    <meta name="description" content="Nơi lưu trữ và chia sẻ kiến thức, ý tưởng cá nhân.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-effects">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>
    
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-icon">✨</span>
                <span class="logo-text">MyBlog</span>
            </a>
            <nav class="nav">
                <a href="index.html" class="nav-link active">Home</a>
                <a href="#" class="nav-link">About</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1 class="hero-title">Chào mừng đến với <span class="gradient-text">Không gian của tôi</span></h1>
            <p class="hero-subtitle">Nơi lưu trữ, chia sẻ ý tưởng và kiến thức. Dễ dàng truy cập từ bất kỳ đâu.</p>
        </section>

        <section class="posts-section">
            <div class="section-header">
                <h2>Bài viết mới nhất</h2>
            </div>
            <div id="posts-container" class="posts-grid">
                <!-- Posts will be injected here via JS -->
                <div class="loading">Đang tải bài viết...</div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 MyBlog. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
