<head>

    <title>HgBlog - Personal Space</title>
    <meta name="description" content="Nơi lưu trữ và chia sẻ kiến thức, ý tưởng cá nhân.">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <div class="background-effects">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>
    
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-icon">✨</span>

    <main class="container">
        <section class="hero">
            <h1 class="hero-title">Chào mừng đến với <span class="gradient-text">Không gian của tôi</span></h1>

            <div class="section-header">
                <h2>Bài viết mới nhất</h2>
                <div id="tags-container" class="tags-filter"></div>
            </div>
            <div id="posts-container" class="posts-grid">
                <!-- Posts will be injected here via JS -->
                <div class="loading">Đang tải bài viết...</div>
            </div>
        </section>
