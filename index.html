<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Blog</title>
    <meta name="description" content="Nơi lưu trữ và chia sẻ kiến thức, ý tưởng cá nhân.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-effects">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>
    
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-icon">✨</span>
                <span class="logo-text">MyBlog</span>
            </a>
            <nav class="nav">
                <a href="index.html" class="nav-link active">Home</a>
                <a href="https://www.youtube.com/@hoanggo101" class="nav-link" target="_blank">YouTube</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1 class="hero-title">Chào mừng đến với <span class="gradient-text">Không gian của tôi</span></h1>
            <p class="hero-subtitle">Nơi lưu trữ, chia sẻ ý tưởng và kiến thức. Dễ dàng truy cập từ bất kỳ đâu.</p>
        </section>

        <section class="posts-section">
            <div class="section-header">
                <h2>Bài viết mới nhất</h2>
            </div>
            <div id="posts-container" class="posts-grid">
                <!-- Posts will be injected here via JS -->
                <div class="loading">Đang tải bài viết...</div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-links">
                <a href="https://www.youtube.com/@hoanggo101" target="_blank" class="youtube-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                    @hoanggo101
                </a>
            </div>
            <p>&copy; 2026 MyBlog. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
